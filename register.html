<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — Bayzid</title>
<meta name="description" content="Create your Bayzid account as a buyer, seller, or affiliate." />
<link rel="icon" href="assets/logos/bayzid-logo-icon.png" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen">

<div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 items-end"></div>

<div class="min-h-screen flex items-center justify-center p-6 py-12">
  <div class="w-full max-w-lg">
    <div class="flex justify-center mb-8">
      <img src="assets/logos/bayzid-logo-full.png" alt="Bayzid" class="h-14" />
    </div>

    <div class="auth-card rounded-3xl p-8 sm:p-10 border border-slate-100">
      <h2 class="font-display text-2xl font-extrabold text-slate-900 mb-1">Create Account</h2>
      <p class="text-slate-500 text-sm mb-8">Join Bayzid to shop, sell, or earn as an affiliate.</p>

      <form id="register-form" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Full Name</label>
          <input id="full-name" type="text" required placeholder="HM Bayzid Hasan"
            class="input-field w-full rounded-xl border border-slate-200 px-4 py-3" />
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
            <input id="email" type="email" required placeholder="you@example.com"
              class="input-field w-full rounded-xl border border-slate-200 px-4 py-3" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Phone Number</label>
            <input id="phone" type="tel" required placeholder="01XXXXXXXXX"
              class="input-field w-full rounded-xl border border-slate-200 px-4 py-3" />
          </div>
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
            <input id="password" type="password" required placeholder="••••••••"
              class="input-field w-full rounded-xl border border-slate-200 px-4 py-3" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Confirm Password</label>
            <input id="confirm-password" type="password" required placeholder="••••••••"
              class="input-field w-full rounded-xl border border-slate-200 px-4 py-3" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Account Type</label>
          <div class="grid grid-cols-3 gap-3">
            <label class="account-type-option cursor-pointer">
              <input type="radio" name="account_type" value="buyer" class="peer sr-only" checked />
              <div class="rounded-xl border-2 border-slate-200 peer-checked:border-[#1E3A8A] peer-checked:bg-blue-50 text-center py-3 text-sm font-medium transition">
                🛍️<br />Buyer
              </div>
            </label>
            <label class="account-type-option cursor-pointer">
              <input type="radio" name="account_type" value="seller" class="peer sr-only" />
              <div class="rounded-xl border-2 border-slate-200 peer-checked:border-[#1E3A8A] peer-checked:bg-blue-50 text-center py-3 text-sm font-medium transition">
                🏪<br />Seller
              </div>
            </label>
            <label class="account-type-option cursor-pointer">
              <input type="radio" name="account_type" value="affiliate" class="peer sr-only" />
              <div class="rounded-xl border-2 border-slate-200 peer-checked:border-[#1E3A8A] peer-checked:bg-blue-50 text-center py-3 text-sm font-medium transition">
                📈<br />Affiliate
              </div>
            </label>
          </div>
        </div>

        <label class="flex items-start gap-2 text-sm text-slate-600">
          <input type="checkbox" id="terms" required class="mt-1 rounded border-slate-300 text-[#1E3A8A] focus:ring-[#1E3A8A]" />
          <span>I agree to Bayzid's <a href="#" class="text-[#1E3A8A] font-medium hover:underline">Terms &amp; Conditions</a> and <a href="#" class="text-[#1E3A8A] font-medium hover:underline">Privacy Policy</a>.</span>
        </label>

        <button type="submit" id="register-btn"
          class="btn-primary w-full rounded-xl text-white font-semibold py-3 shadow-lg shadow-blue-900/20">
          Create Account
        </button>
      </form>

      <p class="text-center text-sm text-slate-500 mt-8">
        Already have an account?
        <a href="login.html" class="font-semibold text-[#1E3A8A] hover:underline">Sign In</a>
      </p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("register-btn");
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirm-password").value;

  if (password !== confirmPassword) {
    showToast("Passwords do not match.", "error");
    return;
  }

  const payload = {
    username: document.getElementById("full-name").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone_number: document.getElementById("phone").value.trim(),
    password,
    confirm_password: confirmPassword,
    account_type: document.querySelector('input[name="account_type"]:checked').value,
  };

  setButtonLoading(btn, true, "Creating account…");
  try {
    await BayzidAPI.register(payload);
    showToast("Account created! Check your email for a code.", "success");
    sessionStorage.setItem("bayzid_pending_identifier", payload.email);
    sessionStorage.setItem("bayzid_otp_purpose", "registration");
    setTimeout(() => (window.location.href = "otp.html"), 800);
  } catch (err) {
    showToast(err.message || "Registration failed. Please try again.", "error");
  } finally {
    setButtonLoading(btn, false);
  }
});
</script>
</body>
</html>
