<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password — Bayzid</title>
<link rel="icon" href="assets/logos/bayzid-logo-icon.png" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen">

<div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 items-end"></div>

<div class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <div class="flex justify-center mb-8">
      <img src="assets/logos/bayzid-logo-full.png" alt="Bayzid" class="h-14" />
    </div>

    <div class="auth-card rounded-3xl p-8 sm:p-10 border border-slate-100">

      <!-- Step 1: request code -->
      <div id="step-request">
        <h2 class="font-display text-2xl font-extrabold text-slate-900 mb-1">Forgot Password?</h2>
        <p class="text-slate-500 text-sm mb-8">Enter your email or phone and we'll send you a reset code.</p>
        <form id="request-form" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Email or Phone</label>
            <input id="request-identifier" type="text" required placeholder="you@example.com"
              class="input-field w-full rounded-xl border border-slate-200 px-4 py-3" />
          </div>
          <button type="submit" id="request-btn"
            class="btn-primary w-full rounded-xl text-white font-semibold py-3 shadow-lg shadow-blue-900/20">
            Send OTP
          </button>
        </form>
      </div>

      <!-- Step 2: set new password (after OTP verified on otp.html) -->
      <div id="step-reset" class="hidden">
        <h2 class="font-display text-2xl font-extrabold text-slate-900 mb-1">Set a New Password</h2>
        <p class="text-slate-500 text-sm mb-8">Enter the code again along with your new password.</p>
        <form id="reset-form" class="space-y-5">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">6-digit Code</label>
            <input id="reset-code" type="text" maxlength="6" required placeholder="••••••"
              class="input-field w-full rounded-xl border border-slate-200 px-4 py-3 tracking-[0.5em] text-center font-semibold" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">New Password</label>
            <input id="new-password" type="password" required placeholder="••••••••"
              class="input-field w-full rounded-xl border border-slate-200 px-4 py-3" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Confirm Password</label>
            <input id="confirm-new-password" type="password" required placeholder="••••••••"
              class="input-field w-full rounded-xl border border-slate-200 px-4 py-3" />
          </div>
          <button type="submit" id="reset-btn"
            class="btn-primary w-full rounded-xl text-white font-semibold py-3 shadow-lg shadow-blue-900/20">
            Reset Password
          </button>
        </form>
      </div>

      <!-- Step 3: success -->
      <div id="step-success" class="hidden text-center">
        <div class="w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-3xl mx-auto mb-5">✅</div>
        <h2 class="font-display text-2xl font-extrabold text-slate-900 mb-1">Password Changed</h2>
        <p class="text-slate-500 text-sm mb-8">Your password was successfully changed. You can now sign in.</p>
        <a href="login.html" class="btn-primary block w-full rounded-xl text-white font-semibold py-3 text-center">Back to Sign In</a>
      </div>
    </div>

    <p class="text-center text-sm text-slate-500 mt-6">
      Remembered your password?
      <a href="login.html" class="font-semibold text-[#1E3A8A] hover:underline">Sign In</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
if (params.get("step") === "reset") {
  document.getElementById("step-request").classList.add("hidden");
  document.getElementById("step-reset").classList.remove("hidden");
}

document.getElementById("request-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("request-btn");
  const identifier = document.getElementById("request-identifier").value.trim();

  setButtonLoading(btn, true, "Sending…");
  try {
    await BayzidAPI.requestOtp({ identifier, purpose: "password_reset" });
    showToast("If an account exists, a code has been sent.", "success");
    sessionStorage.setItem("bayzid_pending_identifier", identifier);
    sessionStorage.setItem("bayzid_otp_purpose", "password_reset");
    setTimeout(() => (window.location.href = "otp.html"), 700);
  } catch (err) {
    showToast(err.message || "Something went wrong.", "error");
  } finally {
    setButtonLoading(btn, false);
  }
});

document.getElementById("reset-form")?.addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("reset-btn");
  const newPassword = document.getElementById("new-password").value;
  const confirmPassword = document.getElementById("confirm-new-password").value;

  if (newPassword !== confirmPassword) {
    showToast("Passwords do not match.", "error");
    return;
  }

  setButtonLoading(btn, true, "Updating…");
  try {
    await BayzidAPI.resetPassword({
      identifier: sessionStorage.getItem("bayzid_pending_identifier"),
      code: document.getElementById("reset-code").value.trim(),
      new_password: newPassword,
      confirm_password: confirmPassword,
    });
    document.getElementById("step-reset").classList.add("hidden");
    document.getElementById("step-success").classList.remove("hidden");
  } catch (err) {
    showToast(err.message || "Invalid or expired code.", "error");
  } finally {
    setButtonLoading(btn, false);
  }
});
</script>
</body>
</html>
